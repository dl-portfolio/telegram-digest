name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the backend can start; no external API is called.
      OPENAI_API_KEY: sk-dummy-ci-key
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create .env from template
        # The template's Telegram API ID is a text placeholder; settings require an integer.
        run: |
          cp .env.example .env
          sed -i 's/^TELEGRAM_API_ID=.*/TELEGRAM_API_ID=12345678/' .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend adminer
      - name: Test backend is up
        run: curl --fail http://localhost:8000/api/v1/utils/health-check/
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color prestart backend
      - run: docker compose down -v --remove-orphans
